<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sudan Store</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#18202a;--muted:#6f7783;--line:#e7eaf0;--accent:#5b4bff;--accent2:#7b67ff;--danger:#d84747}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px max(18px,calc((100vw - 1180px)/2));background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),var(--accent2));color:white;font-weight:900;font-size:18px;box-shadow:0 8px 18px #5b4bff24}.brand b{display:block}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.cart-btn,.chip,.section-head button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer}.cart-btn{display:flex;align-items:center;gap:7px}.cart-btn em{font-style:normal;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:12px}.hero{max-width:1180px;margin:22px auto 0;padding:28px;border-radius:28px;background:linear-gradient(135deg,#1e2550,#6248ff);color:#fff;box-shadow:0 20px 50px #26306d20}.eyebrow{opacity:.75;font-size:13px}.hero h1{margin:8px 0 5px;font-size:34px}.hero p{margin:0;opacity:.84}.section{max-width:1180px;margin:22px auto}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-head h2{margin:0;font-size:19px}.muted{color:var(--muted);font-size:13px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip.active{background:var(--accent);border-color:var(--accent);color:white}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.product{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 22px #16233a08}.pic{aspect-ratio:1.08;background:#eef1f6;display:grid;place-items:center}.pic img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:36px;color:#939aa6}.body{padding:14px}.name{font-weight:750;margin-bottom:7px}.desc{font-size:13px;color:var(--muted);min-height:38px;line-height:1.55}.price{display:flex;align-items:baseline;gap:8px;margin:10px 0}.price b{font-size:19px}.old{text-decoration:line-through;color:#9aa1ad;font-size:12px}.actions{display:flex;gap:8px}.primary{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 13px;cursor:pointer;font-weight:700}.ghost{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;cursor:pointer}.full{width:100%}footer{max-width:1180px;margin:35px auto 20px;color:var(--muted);font-size:12px;display:flex;justify-content:center;gap:8px}.overlay{position:fixed;inset:0;background:#0d102780;z-index:50;display:flex;align-items:flex-end;justify-content:center}.overlay.hidden{display:none}.drawer,.modal{background:#fff;width:min(620px,100%);max-height:92vh;border-radius:24px 24px 0 0;padding:18px;overflow:auto}.modal{width:min(520px,100%);align-self:center;border-radius:24px}.drawer-head{display:flex;align-items:center;justify-content:space-between}.drawer-head h3{margin:0}.drawer-head button{background:none;border:0;font-size:20px}.cart-line{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.cart-line img{width:58px;height:58px;border-radius:12px;object-fit:cover;background:#eef1f6}.qty{display:flex;align-items:center;gap:7px}.qty button{border:1px solid var(--line);background:#fff;border-radius:8px;width:26px;height:26px}.total-row{display:flex;justify-content:space-between;padding:14px 0;font-size:18px}form{display:grid;gap:10px}form input,form textarea{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}form textarea{min-height:90px;resize:vertical}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#151b2b;color:#fff;padding:11px 15px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:80}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{margin-inline:14px}.section{margin-inline:14px}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:26px}.topbar{padding-inline:12px}.cart-btn span{display:none}}@media(max-width:410px){.grid{grid-template-columns:1fr}}

</style>
<script>
window.STORE_CONFIG = {
  supabaseUrl: 'https://yzsxephyymqmpknkphsv.supabase.co',
  supabaseAnonKey: 'sb_publishable_piTGlUSreBD_oULP-aDZmw_tcnMqtFf',
  demo: false
};

</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-mark">T+</div><div><b id="storeName">Sudan Store</b><small id="storeDescription">متجرك الإلكتروني</small></div></div>
  <button class="cart-btn" id="cartButton">🛒 <span>السلة</span><em id="cartCount">0</em></button>
</header>
<main>
  <section class="hero"><div><span class="eyebrow">تسوق بسهولة</span><h1 id="heroTitle">منتجاتك في مكان واحد</h1><p id="heroText">اختر المنتج الذي يعجبك وأرسل طلبك في دقائق.</p></div></section>
  <section class="section"><div class="section-head"><h2>الأقسام</h2><button id="allCats" class="chip active">الكل</button></div><div id="categories" class="chips"></div></section>
  <section class="section"><div class="section-head"><h2>المنتجات</h2><span id="productCount" class="muted"></span></div><div id="products" class="grid"></div></section>
</main>
<footer><span id="footerName">Sudan Store</span><span>•</span><span>متجر إلكتروني مجاني</span></footer>
<div id="toast" class="toast"></div>
<div id="cartDrawer" class="overlay hidden"><div class="drawer"><div class="drawer-head"><h3>سلة المشتريات</h3><button id="closeCart">✕</button></div><div id="cartItems"></div><div class="total-row"><span>الإجمالي</span><b id="cartTotal">0</b></div><button class="primary full" id="checkoutButton">إتمام الطلب</button></div></div>
<div id="checkoutModal" class="overlay hidden"><div class="modal"><div class="drawer-head"><h3>بيانات الطلب</h3><button id="closeCheckout">✕</button></div><form id="checkoutForm"><input required id="customerName" placeholder="الاسم"><input required id="phone" placeholder="رقم الهاتف"><input id="city" placeholder="المدينة"><input id="address" placeholder="العنوان"><textarea id="notes" placeholder="ملاحظات"></textarea><button class="primary full" type="submit">تأكيد الطلب</button></form></div></div>
<script>
(function(){
'use strict';
var cfg=window.STORE_CONFIG||{}; var demo=cfg.demo!==false;
var sb=null; try{if(cfg.supabaseUrl&&cfg.supabaseUrl.indexOf('YOUR-')===-1&&window.supabase) sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey)}catch(e){}
var products=demo?[{id:1,name:'منتج تجريبي 1',description:'هذا مثال حتى ترى شكل المتجر قبل الربط.',price:25000,old_price:30000,image_url:'',category_id:1,visible:true,featured:true},{id:2,name:'منتج تجريبي 2',description:'غيّر هذه البيانات من لوحة الإدارة بعد الربط.',price:18000,old_price:null,image_url:'',category_id:2,visible:true,featured:false},{id:3,name:'منتج مميز',description:'منتج ثالث للتجربة.',price:42000,old_price:50000,image_url:'',category_id:1,visible:true,featured:true}]:[];
var categories=demo?[{id:1,name:'جديد',active:true,sort_order:0},{id:2,name:'الأكثر مبيعًا',active:true,sort_order:1}]:[];
var settings={store_name:'Sudan Store',store_description:'متجرك الإلكتروني',whatsapp:'',currency:'SDG'}; var currentCat=0; var cart=[];
function $(id){return document.getElementById(id)} function money(v){return Number(v||0).toLocaleString('ar-EG')+' '+(settings.currency||'SDG')}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(function(){$('toast').classList.remove('show')},2200)}
function render(){ $('storeName').textContent=settings.store_name; $('footerName').textContent=settings.store_name; $('storeDescription').textContent=settings.store_description; $('heroText').textContent=settings.store_description; var cs=$('categories'); cs.innerHTML=''; categories.slice().sort(function(a,b){return a.sort_order-b.sort_order}).forEach(function(c){var b=document.createElement('button');b.className='chip'+(currentCat===c.id?' active':'');b.textContent=c.name;b.onclick=function(){currentCat=c.id;render()};cs.appendChild(b)});var arr=products.filter(function(p){return p.visible&&(currentCat===0||p.category_id===currentCat)});$('productCount').textContent=arr.length+' منتج';var g=$('products');g.innerHTML='';if(!arr.length){g.innerHTML='<div class="muted">لا توجد منتجات حاليًا.</div>';return}arr.forEach(function(p){var c=document.createElement('div');c.className='product';c.innerHTML='<div class="pic">'+(p.image_url?'<img src="'+escapeHtml(p.image_url)+'" alt="">':'<div class="placeholder">🛍️</div>')+'</div><div class="body"><div class="name">'+escapeHtml(p.name)+'</div><div class="desc">'+escapeHtml(p.description||'')+'</div><div class="price"><b>'+money(p.price)+'</b>'+(p.old_price?'<span class="old">'+money(p.old_price)+'</span>':'')+'</div><div class="actions"><button class="primary">أضف للسلة</button><button class="ghost">التفاصيل</button></div></div>';c.querySelector('.primary').onclick=function(){add(p)};c.querySelector('.ghost').onclick=function(){showProduct(p)};g.appendChild(c)}) }
function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,function(ch){return ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'})[ch]})}
function add(p){var x=cart.find(function(i){return i.id===p.id}); if(x)x.qty++; else cart.push({id:p.id,product:p,qty:1}); updateCart();toast('تمت إضافة المنتج للسلة')}
function updateCart(){$('cartCount').textContent=cart.reduce(function(a,b){return a+b.qty},0);var el=$('cartItems');el.innerHTML='';if(!cart.length){el.innerHTML='<p class="muted">السلة فارغة.</p>'}cart.forEach(function(i){var r=document.createElement('div');r.className='cart-line';r.innerHTML=(i.product.image_url?'<img src="'+escapeHtml(i.product.image_url)+'">':'<div class="pic" style="width:58px;height:58px;border-radius:12px">🛍️</div>')+'<div><b>'+escapeHtml(i.product.name)+'</b><div class="muted">'+money(i.product.price)+'</div></div><div class="qty"><button>−</button><b>'+i.qty+'</b><button>+</button></div>';r.querySelectorAll('button')[0].onclick=function(){i.qty--;if(i.qty<=0)cart=cart.filter(function(x){return x.id!==i.id});updateCart()};r.querySelectorAll('button')[1].onclick=function(){i.qty++;updateCart()};el.appendChild(r)});$('cartTotal').textContent=money(cart.reduce(function(a,b){return a+b.product.price*b.qty},0));$('checkoutButton').disabled=!cart.length}
function showProduct(p){alert(p.name+'\n\n'+(p.description||'')+'\n\n'+money(p.price))}
async function load(){if(sb){try{var s=await sb.from('store_settings').select('*').eq('id',1).single();if(!s.error&&s.data)settings={store_name:s.data.store_name,store_description:s.data.store_description,whatsapp:s.data.whatsapp,currency:s.data.currency,logo_url:s.data.logo_url};var c=await sb.from('categories').select('*').eq('active',true).order('sort_order',{ascending:true});if(!c.error)categories=c.data;var p=await sb.from('products').select('*').eq('visible',true).order('sort_order',{ascending:true}).order('created_at',{ascending:false});if(!p.error)products=p.data}catch(e){console.log(e)}}render();updateCart()}
$('cartButton').onclick=function(){$('cartDrawer').classList.remove('hidden');updateCart()};$('closeCart').onclick=function(){$('cartDrawer').classList.add('hidden')};$('checkoutButton').onclick=function(){$('cartDrawer').classList.add('hidden');$('checkoutModal').classList.remove('hidden')};$('closeCheckout').onclick=function(){$('checkoutModal').classList.add('hidden')};$('checkoutForm').onsubmit=async function(e){e.preventDefault();if(!cart.length)return;var payload={customer_name:$('customerName').value.trim(),phone:$('phone').value.trim(),city:$('city').value.trim(),address:$('address').value.trim(),notes:$('notes').value.trim(),items:cart.map(function(i){return {product_id:i.product.id,name:i.product.name,price:i.product.price,qty:i.qty}}),total:cart.reduce(function(a,b){return a+b.product.price*b.qty},0),status:'new'};if(sb){var r=await sb.from('orders').insert(payload);if(r.error){toast('تعذر إرسال الطلب');return}}else{localStorage.setItem('demo_last_order',JSON.stringify(payload))}$('checkoutModal').classList.add('hidden');cart=[];updateCart();toast('تم إرسال طلبك بنجاح')};load();
})();

</script>
</body></html>
